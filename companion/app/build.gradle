plugins {
    id 'com.android.application'
}

android {
    namespace 'fatidaprilian.evtraw'
    compileSdk 34

    defaultConfig {
        applicationId "fatidaprilian.evtraw"
        minSdk 26
        targetSdk 34
        versionCode 102
        versionName "v1.0.2"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'evtraw123'
            keyAlias 'evtraw'
            keyPassword 'evtraw123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
