plugins {
    id 'com.android.application'
}

android {
    namespace 'fatidaprilian.evtraw'
    compileSdk 34

    defaultConfig {
        applicationId "fatidaprilian.evtraw"
        minSdk 26
        targetSdk 34
        versionCode 107
        versionName "v1.0.7"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: "release.jks"
            def keystoreFile = file(keystorePath)
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("KEY_ALIAS")
            def keyPassword = System.getenv("KEY_PASSWORD") ?: keystorePassword

            if (keystoreFile.exists() && keystorePassword && keyAlias) {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: "release.jks"
            def keystoreFile = file(keystorePath)
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("KEY_ALIAS")

            if (keystoreFile.exists() && keystorePassword && keyAlias) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
