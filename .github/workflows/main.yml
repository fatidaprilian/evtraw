name: Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      versionCode:
        description: 'Version Code (e.g. 100)'
        required: true
        default: '100'
      changelog:
        description: 'Release Changelog'
        required: true
        default: 'Raw touch input optimizations and updates.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update module.prop
        run: |
          sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/g" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ github.event.inputs.versionCode }}/g" module.prop

      - name: Generate update.json (For Auto-Update)
        run: |
          cat <<EOF > update.json
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/evtraw-${{ github.event.inputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md"
          }
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ github.event.inputs.version }}"
          file_pattern: "module.prop update.json"

      - name: Create Module Zip
        run: |
          zip -r9 evtraw-${{ github.event.inputs.version }}.zip . -x "*.git*" -x ".github/*" -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: EvtRaw ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: evtraw-${{ github.event.inputs.version }}.zip
