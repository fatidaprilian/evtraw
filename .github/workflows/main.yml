name: Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      versionCode:
        description: 'Version Code (e.g. 100)'
        required: true
        default: '100'
      changelog:
        description: 'Release Changelog'
        required: true
        default: 'Raw touch input optimizations and updates.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update module.prop and companion build.gradle
        run: |
          sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/g" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ github.event.inputs.versionCode }}/g" module.prop
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g" companion/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version }}\"/g" companion/app/build.gradle

      - name: Generate update.json (For Auto-Update)
        run: |
          cat <<EOF > update.json
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/evtraw-${{ github.event.inputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md"
          }
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ github.event.inputs.version }}"
          file_pattern: "module.prop update.json companion/app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build EvtRaw Companion APK
        run: |
          cd companion
          gradle assembleRelease --stacktrace --no-daemon
          cd ..
          cp companion/app/build/outputs/apk/release/app-release.apk ./evtraw.apk
          rm -f ./RTIapp.apk

      - name: Create Module Zip
        run: |
          zip -r9 evtraw-${{ github.event.inputs.version }}.zip . -x "*.git*" -x ".github/*" -x "*.zip" -x "companion/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: EvtRaw ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: evtraw-${{ github.event.inputs.version }}.zip
