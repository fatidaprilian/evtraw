name: Post Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      versionCode:
        description: 'Version Code (e.g. 100)'
        required: true
        default: '100'
      changelog:
        description: 'Release Changelog'
        required: true
        default: 'Raw touch input optimizations and updates.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Update module.prop
        run: |
          sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/g" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ github.event.inputs.versionCode }}/g" module.prop

      - name: Generate update.json (For Auto-Update)
        run: |
          cat <<EOF > update.json
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/evtraw-${{ github.event.inputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md"
          }
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ github.event.inputs.version }}"
          file_pattern: "module.prop update.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build EvtRaw Companion APK
        run: |
          cd companion
          gradle assembleRelease || ./gradlew assembleRelease
          cd ..
          cp companion/app/build/outputs/apk/release/*.apk ./evtraw.apk
          rm -f ./RTIapp.apk

      - name: Create Module Zip
        run: |
          zip -r9 evtraw-${{ github.event.inputs.version }}.zip . -x "*.git*" -x ".github/*" -x "*.zip" -x "companion/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: EvtRaw ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: evtraw-${{ github.event.inputs.version }}.zip

      - name: Send Telegram Notification
        if: env.TG_BOT != '' && env.TG_CHAT != ''
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          VERSION: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          MODULE_NAME=$(grep '^name=' module.prop | head -n1 | cut -d'=' -f2- | tr -d '\r' | xargs)
          BANNER_FILE="rti.webp"
          BANNER_PATH="$(pwd)/${BANNER_FILE}"

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          SHORT_SHA=${SHA::7}

          MESSAGE=$(cat <<EOF
          <b>${MODULE_NAME} Update</b>

          <b>Branch:</b> ${BRANCH}
          <b>Commit:</b> <a href="https://github.com/${REPO}/commit/${SHA}">${SHORT_SHA}</a> - ${COMMIT_MSG}
          <b>Compare:</b> <a href="https://github.com/${REPO}/commits/${BRANCH}">View Changes</a>
          <b>Workflow Run:</b> <a href="https://github.com/${REPO}/actions/runs/${RUN_ID}">View Log</a>
          <b>Release:</b> <a href="https://github.com/${REPO}/releases/tag/${VERSION}">Download ${VERSION}</a>
          EOF
          )

          if [ -f "$BANNER_PATH" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_BOT}/sendPhoto" \
              --form-string "chat_id=${TG_CHAT}" \
              -F "photo=@${BANNER_PATH}" \
              --form-string "parse_mode=HTML" \
              --form-string "caption=$MESSAGE"
          fi
